services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: objectai
      POSTGRES_PASSWORD: objectai
      POSTGRES_DB: objectai
    ports:
      - "5432:5432"
    volumes:
      - objectai_db_data:/var/lib/postgresql/data

volumes:
  objectai_db_data:
